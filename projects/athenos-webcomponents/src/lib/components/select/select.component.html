<div
  class="ath-select"
  [class.ath-select--sm]="size() === 'sm'"
  [class.ath-select--error]="error()"
  [class.ath-select--disabled]="isDisabled()"
>
  @if (label()) {
    <label class="ath-select__label" [for]="selectId()">
      {{ label() }}
      @if (required()) {
        <span class="ath-select__required">*</span>
      }
    </label>
  }

  <div class="ath-select__wrapper">
    <select
      [id]="selectId()"
      [attr.aria-label]="ariaLabel() || null"
      [disabled]="isDisabled()"
      [value]="fieldValue()"
      (change)="onSelectionChange($event)"
      (blur)="onTouched()"
      class="ath-select__field"
    >
      @if (placeholderText()) {
        <option value="" disabled [selected]="!fieldValue()">{{ placeholderText() }}</option>
      }
      @for (option of options(); track option.value) {
        <!-- [selected] as well as the select's [value]: options that arrive after
             the value (loaded later) must still show it. -->
        <option
          [value]="option.value"
          [disabled]="option.disabled"
          [selected]="option.value === fieldValue()"
        >
          {{ option.label }}
        </option>
      }
    </select>
    <ath-icon [img]="chevronIcon" [size]="16" class="ath-select__chevron" />
  </div>

  @if (error()) {
    <div class="ath-select__error">
      <ath-icon [img]="alertIcon" [size]="14" />
      {{ error() }}
    </div>
  }

  @if (hint() && !error()) {
    <div class="ath-select__hint">{{ hint() }}</div>
  }
</div>
