@if (mode() === 'numbered') {
  <button
    type="button"
    class="ath-page__btn ath-page__btn--nav"
    [disabled]="page() <= 1"
    [attr.aria-label]="labels.pageFirst()"
    (click)="goFirst()"
  >
    <lucide-icon [img]="firstIcon" [size]="14" />
  </button>
  <button
    type="button"
    class="ath-page__btn ath-page__btn--nav"
    [disabled]="page() <= 1"
    [attr.aria-label]="labels.pagePrevious()"
    (click)="goPrev()"
  >
    <lucide-icon [img]="prevIcon" [size]="14" />
  </button>

  @for (item of pages(); track $index) {
    @if (item === 'ellipsis') {
      <span class="ath-page__ellipsis" aria-hidden="true">
        <lucide-icon [img]="ellipsisIcon" [size]="12" />
      </span>
    } @else {
      <button
        type="button"
        class="ath-page__btn"
        [class.ath-page__btn--active]="item === page()"
        [attr.aria-current]="item === page() ? 'page' : null"
        [attr.aria-label]="pageLabel(item)"
        (click)="goTo(item)"
      >
        {{ item }}
      </button>
    }
  }

  <button
    type="button"
    class="ath-page__btn ath-page__btn--nav"
    [disabled]="page() >= totalPages()"
    [attr.aria-label]="labels.pageNext()"
    (click)="goNext()"
  >
    <lucide-icon [img]="nextIcon" [size]="14" />
  </button>
  <button
    type="button"
    class="ath-page__btn ath-page__btn--nav"
    [disabled]="page() >= totalPages()"
    [attr.aria-label]="labels.pageLast()"
    (click)="goLast()"
  >
    <lucide-icon [img]="lastIcon" [size]="14" />
  </button>
} @else {
  <button
    type="button"
    class="ath-page__btn ath-page__btn--cursor"
    [disabled]="!hasPrev()"
    (click)="goPrev()"
  >
    <lucide-icon [img]="prevIcon" [size]="14" />
    <span>{{ labels.previous() }}</span>
  </button>
  @if (summary()) {
    <span class="ath-page__summary">{{ summary() }}</span>
  }
  <button
    type="button"
    class="ath-page__btn ath-page__btn--cursor"
    [disabled]="!hasNext()"
    (click)="goNext()"
  >
    <span>{{ labels.next() }}</span>
    <lucide-icon [img]="nextIcon" [size]="14" />
  </button>
}
