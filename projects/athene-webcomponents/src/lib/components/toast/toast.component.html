<!--
  data-ath-top-layer: kept above modal dialogs (AthOverlayStack.raiseTopLayer).
  The stack is a labelled region; new toasts are read out by the two live
  regions at its end (the stack itself is not live, so nothing is read twice).
-->
<section
  class="ath-toast-container"
  [class.ath-toast-container--top]="placement() === 'top'"
  [class.ath-toast-container--expanded]="expanded()"
  [attr.aria-label]="regionText()"
  data-ath-top-layer
  (focusin)="onFocusIn($event)"
  (focusout)="onFocusOut($event)"
>
  @if (collapsed().size > 0) {
    <button
      type="button"
      class="ath-toast-more"
      animate.enter="ath-toast-more--enter"
      (click)="expand()"
    >
      <ath-icon [img]="moreIcon" [size]="12" [strokeWidth]="2.25" />
      {{ moreText() }}
    </button>
  }
  <ol class="ath-toast-list" (pointerenter)="onPointerEnter()" (pointerleave)="onPointerLeave()">
    @for (toast of toasts; track toast.id) {
      <li
        class="ath-toast-slot"
        [class.ath-toast-slot--collapsed]="collapsed().has(toast.id)"
        [attr.inert]="collapsed().has(toast.id) ? '' : null"
        animate.enter="ath-toast-slot--enter"
        animate.leave="ath-toast-slot--leave"
      >
        <div class="ath-toast-sizer">
          <div
            class="ath-toast"
            [class]="'ath-toast ath-toast--' + toast.variant"
            [class.ath-toast--titled]="!!toast.title"
            [attr.data-toast-id]="toast.id"
            tabindex="-1"
            (keydown)="onKeydown($event, toast.id)"
          >
            <span class="ath-toast__icon" aria-hidden="true">
              <ath-icon [img]="getIcon(toast.variant)" [size]="15" [strokeWidth]="2.5" />
            </span>
            <div class="ath-toast__body">
              @if (toast.title) {
                <p class="ath-toast__title">{{ toast.title }}</p>
              }
              <p class="ath-toast__message">{{ toast.message }}</p>
            </div>
            @if (toast.action; as action) {
              <button type="button" class="ath-toast__action" (click)="runAction(toast.id)">
                {{ action.label }}
              </button>
            }
            <button
              type="button"
              class="ath-toast__close"
              [attr.aria-label]="closeLabel(toast)"
              (click)="dismiss(toast.id)"
            >
              <ath-icon [img]="closeIcon" [size]="12" [strokeWidth]="2.25" />
            </button>
            @if (timed(toast)) {
              <span class="ath-toast__timer" aria-hidden="true"></span>
            }
          </div>
        </div>
      </li>
    }
  </ol>
  <div class="ath-toast-live" aria-live="polite" role="status">{{ politeText() }}</div>
  <div class="ath-toast-live" aria-live="assertive" role="alert">{{ assertiveText() }}</div>
</section>
