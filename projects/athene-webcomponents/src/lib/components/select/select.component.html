<div
  class="ath-select"
  [class.ath-select--sm]="size === 'sm'"
  [class.ath-select--error]="error"
  [class.ath-select--disabled]="disabled"
>
  @if (label) {
    <label class="ath-select__label" [for]="selectId">
      {{ label }}
      @if (required) {
        <span class="ath-select__required">*</span>
      }
    </label>
  }

  <div class="ath-select__wrapper">
    <select
      [id]="selectId"
      [attr.aria-label]="ariaLabel || null"
      [disabled]="disabled"
      [value]="value"
      (change)="onSelectionChange($event)"
      (blur)="onTouched()"
      class="ath-select__field"
    >
      @if (placeholder) {
        <option value="" disabled [selected]="!value">{{ placeholder }}</option>
      }
      @for (option of options; track option.value) {
        <!-- [selected] as well as the select's [value]: options that arrive after
             the value (loaded later) must still show it. -->
        <option
          [value]="option.value"
          [disabled]="option.disabled"
          [selected]="option.value === value"
        >
          {{ option.label }}
        </option>
      }
    </select>
    <lucide-icon [img]="chevronIcon" [size]="16" class="ath-select__chevron" />
  </div>

  @if (error) {
    <div class="ath-select__error">
      <lucide-icon [img]="alertIcon" [size]="14" />
      {{ error }}
    </div>
  }

  @if (hint && !error) {
    <div class="ath-select__hint">{{ hint }}</div>
  }
</div>
