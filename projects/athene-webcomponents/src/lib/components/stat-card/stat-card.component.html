<div class="ath-stat-card">
  <span class="ath-stat-card__label">{{ label }}</span>
  <div class="ath-stat-card__value-row">
    <span class="ath-stat-card__value">{{ value }}</span>
    @if (trend) {
      <span
        class="ath-stat-card__trend"
        [class.ath-stat-card__trend--up]="trend === 'up'"
        [class.ath-stat-card__trend--down]="trend === 'down'"
      >
        {{ trend === 'up' ? '↑' : '↓' }}
      </span>
    }
  </div>
  @if (subValue) {
    <span class="ath-stat-card__sub">{{ subValue }}</span>
  }
</div>
