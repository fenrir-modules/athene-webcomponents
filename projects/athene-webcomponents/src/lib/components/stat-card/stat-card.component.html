<div class="ath-stat-card">
  <div class="ath-stat-card__head">
    <span class="ath-stat-card__label">{{ label }}</span>
    @if (delta != null && deltaDirection) {
      <span class="ath-stat-card__delta" [attr.data-direction]="deltaDirection">{{ delta }}</span>
    }
  </div>
  <div class="ath-stat-card__value-row">
    <span class="ath-stat-card__value">{{ value }}</span>
    @if (trend && delta == null) {
      <span
        class="ath-stat-card__trend"
        [class.ath-stat-card__trend--up]="trend === 'up'"
        [class.ath-stat-card__trend--down]="trend === 'down'"
      >
        {{ trend === 'up' ? '↑' : '↓' }}
      </span>
    }
    @if (sparkData && sparkData.length >= 2) {
      <ath-sparkline
        class="ath-stat-card__spark"
        [data]="sparkData"
        [color]="sparkColor"
        [width]="70"
        [height]="22"
      />
    }
  </div>
  @if (subValue) {
    <span class="ath-stat-card__sub">{{ subValue }}</span>
  }
</div>
