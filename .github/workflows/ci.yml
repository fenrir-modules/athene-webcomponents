# Quality gates of @athenos/webcomponents (Athenos quality overhaul, step 1.8b).
# Release packaging lives in release.yml, which calls this workflow first.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Regenerate the darwin screenshot baselines on the CI runner and upload them as an artifact'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Angular 22 needs Node ^22.22.3 or ^24.15 (W4-A; Storybook 10 >= 22.12).
  NODE_VERSION: '24.15.0'
  CI: 'true'

jobs:
  check:
    name: lint, unit tests, tokens, build:lib
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (shared config, ESLint, Stylelint, i18n, tsc, a11y, tokens:check, Prettier, knip)
        run: npm run lint
      - name: Token pipeline tests
        run: npm run test:tokens
      # Vitest in browser mode (W5-B): headless Chromium through Playwright,
      # the version @playwright/test pins.
      - name: Install Chromium for the unit tests
        run: npx playwright install --with-deps --only-shell chromium
      # No continue-on-error: a red unit test fails the build (QA-16).
      - name: Unit tests
        run: npx ng test --watch=false
      # The same specs without zone.js (quality step 4.1): a component that
      # only updates because zone.js ticked fails here.
      - name: Unit tests (zoneless)
        run: npm run test:zoneless -- --watch=false
      - name: Build library
        run: npm run build:lib
      # Git installs ship the committed dist/ and never build (package.json
      # has no build/prepare/install scripts), so dist/ must be exactly what
      # the sources build to, and every entry point the root package.json
      # names must exist in it (ng-packagr 19 no longer writes esm2022/).
      # Locally: npm run check:dist.
      - name: dist/ matches the build, entry points exist, no install-time scripts
        run: node scripts/check-package.mjs --dist

  # axe on every story in light and dark. Platform independent, so Linux.
  catalogue-a11y:
    name: Storybook build + axe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build Storybook
        run: npm run build-storybook
      - name: axe on every story (violations not in a11y-baseline.json fail)
        run: npm run test:storybook
        env:
          SB_VISUAL: 'off'
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-a11y-report
          path: test-results/
          retention-days: 14

  # Screenshot comparison. The committed baselines are rendered on macOS
  # (tests/storybook/__screenshots__/darwin); font rasterisation differs on
  # Linux, so this job runs on a macOS runner. See README, "Component catalogue".
  catalogue-visual:
    name: Storybook build + screenshots
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --only-shell chromium
      - name: Build Storybook
        run: npm run build-storybook
      - name: Compare screenshots (light/dark × 375/768/1280)
        if: ${{ !inputs.update_baselines }}
        run: npm run test:storybook
        env:
          SB_A11Y: 'off'
      - name: Regenerate baselines
        if: ${{ inputs.update_baselines }}
        run: npm run test:storybook:update
        env:
          SB_A11Y: 'off'
      - name: Upload regenerated baselines
        if: ${{ inputs.update_baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-baselines-darwin
          path: tests/storybook/__screenshots__/darwin/
          retention-days: 14
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-visual-diffs
          path: test-results/
          retention-days: 14
