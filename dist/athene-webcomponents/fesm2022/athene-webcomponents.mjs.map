<button
  [type]="type()"
  [disabled]="disabled() || busy()"
  [class]="buttonClasses()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="busy()"
  [attr.aria-pressed]="pressed()"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="controls()"
  (click)="handleClick($event)"
>
  @if (busy()) {
    <span class="ath-button__loader-wrap">
      <ath-icon [img]="loaderIcon" class="ath-button__loader" [size]="18" aria-hidden="true" />
    </span>
  }
  <span class="ath-button__content" [class.ath-button__content--hidden]="busy()">
    <ng-content />
  </span>
</button>
