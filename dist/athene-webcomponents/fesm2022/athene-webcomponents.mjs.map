@if (empty()) {
  <span
    class="ath-avatar ath-avatar--empty"
    [attr.data-size]="size()"
    role="img"
    [attr.aria-label]="accessibleName()"
    [attr.title]="tooltip()"
  >
    <lucide-icon [img]="userIcon" [size]="iconSize()" aria-hidden="true" />
  </span>
} @else {
  <span
    class="ath-avatar"
    [attr.data-size]="size()"
    [attr.data-tone]="tone()"
    role="img"
    [attr.aria-label]="accessibleName()"
    [attr.title]="tooltip()"
  >
    @if (image(); as url) {
      <img [src]="url" alt="" class="ath-avatar__image" (error)="onImageError()" />
    }
    <span class="ath-avatar__initials" aria-hidden="true">{{ initials() }}</span>
  </span>
}
