<!-- data-ath-top-layer: kept above modal dialogs (AthOverlayStack.raiseTopLayer). -->
<div class="ath-toast-container" aria-live="polite" data-ath-top-layer>
  @for (toast of toasts; track toast.id) {
    <div class="ath-toast" [class]="'ath-toast ath-toast--' + toast.variant">
      <lucide-icon [img]="getIcon(toast.variant)" [size]="18" class="ath-toast__icon" />
      <span class="ath-toast__message">{{ toast.message }}</span>
      @if (toast.action; as action) {
        <button type="button" class="ath-toast__action" (click)="runAction(toast.id)">
          {{ action.label }}
        </button>
      }
      <button
        type="button"
        class="ath-toast__close"
        [attr.aria-label]="'Dismiss notification: ' + toast.message"
        (click)="dismiss(toast.id)"
      >
        <lucide-icon [img]="closeIcon" [size]="14" />
      </button>
    </div>
  }
</div>
