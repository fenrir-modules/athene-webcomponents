<!-- One default slot, shown in the body or, when bare, on its own. -->
<ng-template #content><ng-content /></ng-template>

@if (open()) {
  <dialog
    #dialog
    class="ath-dialog"
    tabindex="-1"
    [class]="bare() ? 'ath-dialog--bare' : 'ath-dialog--' + size()"
    [attr.role]="role() === 'alertdialog' ? 'alertdialog' : null"
    [attr.aria-labelledby]="title() && !bare() ? titleId : null"
    [attr.aria-label]="title() && !bare() ? null : ariaLabel()"
    [attr.aria-describedby]="description() && !bare() ? descriptionId : null"
    (keydown)="onKeydown($event)"
    (cancel)="onCancel($event)"
    (close)="onNativeClose()"
  >
    @if (bare()) {
      <div class="ath-dialog__bare">
        <ng-container [ngTemplateOutlet]="content" />
      </div>
    } @else {
      <div class="ath-dialog__surface">
        <header class="ath-dialog__header">
          <div class="ath-dialog__header-text">
            @if (title()) {
              <h2 class="ath-dialog__title" [id]="titleId">{{ title() }}</h2>
            }
            @if (description()) {
              <p class="ath-dialog__description" [id]="descriptionId">{{ description() }}</p>
            }
            <ng-content select="[slot=header],[athDialogHeader]" />
          </div>
          @if (showClose()) {
            <button
              class="ath-dialog__close"
              type="button"
              [attr.aria-label]="closeText()"
              (click)="close()"
            >
              <ath-icon [img]="closeIcon" [size]="18" aria-hidden="true" />
            </button>
          }
        </header>

        <div class="ath-dialog__body">
          <ng-container [ngTemplateOutlet]="content" />
        </div>

        <footer class="ath-dialog__footer">
          <ng-content select="[slot=footer],[athDialogFooter]" />
        </footer>
      </div>
    }
  </dialog>
}
