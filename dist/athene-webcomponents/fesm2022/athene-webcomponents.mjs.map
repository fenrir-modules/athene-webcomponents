<div [class]="spinnerClasses()" role="status" [attr.aria-label]="labels.loading()">
  <svg viewBox="0 0 24 24" fill="none" class="ath-spinner__svg">
    <circle
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="3"
      class="ath-spinner__track"
    />
    <path
      d="M12 2a10 10 0 0 1 10 10"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
      class="ath-spinner__arc"
    />
  </svg>
</div>
