<div class="ath-search-input">
  <ath-icon [img]="searchIcon" [size]="18" class="ath-search-input__icon" />
  <input
    type="text"
    class="ath-search-input__field"
    [placeholder]="placeholderText()"
    [value]="value()"
    (input)="onInput($event)"
  />
  @if (value()) {
    <button
      type="button"
      class="ath-search-input__clear"
      [attr.aria-label]="labels.clearSearch()"
      (click)="clear()"
    >
      <ath-icon [img]="clearIcon" [size]="16" />
    </button>
  }
</div>
