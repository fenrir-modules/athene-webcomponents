<span #trigger class="ath-dropdown__trigger">
  <ng-content />
</span>

<!-- ath-dropdown__menu: app code checks for an open dropdown by this class. -->
<ath-menu
  panelClass="ath-dropdown__menu"
  [anchor]="trigger"
  [align]="menuAlign()"
  (openChange)="onOpenChange($event)"
>
  @for (entry of entries(); track entry.key) {
    @if (entry.action; as item) {
      <button
        athMenuItem
        role="menuitem"
        class="ath-dropdown__item"
        [class.ath-dropdown__item--danger]="item.variant === 'danger'"
        [icon]="item.icon"
        [variant]="item.variant ?? 'default'"
        [disabled]="!!item.disabled"
        [disabledReason]="item.title"
        [tooltip]="item.title"
        [shortcut]="item.shortcut ?? null"
        (triggered)="itemClicked.emit(item.id)"
      >
        {{ item.label }}
      </button>
    } @else {
      <ath-menu-separator />
    }
  }
</ath-menu>
