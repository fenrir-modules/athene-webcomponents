<ath-option-picker
  [options]="options()"
  [(value)]="value"
  [placeholder]="placeholder()"
  [searchPlaceholder]="searchPlaceholder()"
  [disabled]="disabled()"
  [clearable]="clearable()"
  [loading]="loading()"
  [optionTemplate]="optionTpl()"
  [trigger]="bare() ? 'none' : 'button'"
  [anchor]="bare() ? host : null"
  [matchWidth]="!bare()"
  size="md"
  align="auto"
  (queryChange)="queryChange.emit($event)"
  (opened)="opened.emit()"
  (closed)="closed.emit()"
/>
