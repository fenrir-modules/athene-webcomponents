<div class="ath-tabs" role="tablist">
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      role="tab"
      [class]="getTabClasses(tab)"
      [attr.aria-selected]="tab.id === activeTab"
      [disabled]="tab.disabled"
      (click)="selectTab(tab)"
    >
      <span class="ath-tabs__label">{{ tab.label }}</span>
      @if (tab.count != null && tab.count !== 0 && tab.count !== '') {
        <span class="ath-tabs__count">{{ tab.count }}</span>
      }
    </button>
  }
</div>
