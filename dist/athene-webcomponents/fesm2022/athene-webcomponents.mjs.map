@if (open()) {
  <dialog
    #dialog
    class="ath-dialog"
    tabindex="-1"
    [class]="'ath-dialog--' + size()"
    [attr.role]="role() === 'alertdialog' ? 'alertdialog' : null"
    [attr.aria-labelledby]="title() ? titleId : null"
    [attr.aria-label]="title() ? null : ariaLabel()"
    [attr.aria-describedby]="description() ? descriptionId : null"
    (keydown)="onKeydown($event)"
    (cancel)="onCancel($event)"
    (close)="onNativeClose()"
  >
    <div class="ath-dialog__surface">
      <header class="ath-dialog__header">
        <div class="ath-dialog__header-text">
          @if (title()) {
            <h2 class="ath-dialog__title" [id]="titleId">{{ title() }}</h2>
          }
          @if (description()) {
            <p class="ath-dialog__description" [id]="descriptionId">{{ description() }}</p>
          }
          <ng-content select="[slot=header],[athDialogHeader]" />
        </div>
        @if (showClose()) {
          <button
            class="ath-dialog__close"
            type="button"
            [attr.aria-label]="closeText()"
            (click)="close()"
          >
            <lucide-icon [img]="closeIcon" [size]="18" aria-hidden="true" />
          </button>
        }
      </header>

      <div class="ath-dialog__body">
        <ng-content />
      </div>

      <footer class="ath-dialog__footer">
        <ng-content select="[slot=footer],[athDialogFooter]" />
      </footer>
    </div>
  </dialog>
}
