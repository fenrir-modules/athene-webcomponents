<div class="ath-search-input">
  <lucide-icon [img]="searchIcon" [size]="18" class="ath-search-input__icon" />
  <input
    type="text"
    class="ath-search-input__field"
    [placeholder]="placeholder"
    [value]="value"
    (input)="onInput($event)"
  />
  @if (value) {
    <button type="button" class="ath-search-input__clear" [attr.aria-label]="labels.clearSearch()" (click)="clear()">
      <lucide-icon [img]="clearIcon" [size]="16" />
    </button>
  }
</div>
