<button
  type="button"
  class="ath-fdrop"
  [class.ath-fdrop--dragging]="dragging()"
  [disabled]="disabled()"
  (click)="openPicker()"
>
  <span class="ath-fdrop__icon" aria-hidden="true">
    <ath-icon [img]="uploadIcon" [size]="20" />
  </span>
  <span class="ath-fdrop__prompt">
    <ng-content>{{ prompt() ?? labels.fileDropPrompt() }}</ng-content>
  </span>
  @if (accept() || maxSizeMb() > 0) {
    <span class="ath-fdrop__hint">
      @if (accept()) {
        <span>{{ accept() }}</span>
      }
      @if (accept() && maxSizeMb() > 0) {
        <span aria-hidden="true">·</span>
      }
      @if (maxSizeMb() > 0) {
        <span>max {{ maxSizeMb() }} MB</span>
      }
    </span>
  }
</button>
<input
  #fileInput
  type="file"
  class="ath-fdrop__input"
  [accept]="accept() ?? ''"
  [multiple]="multiple()"
  (change)="onPickerChange($event)"
  hidden
/>
